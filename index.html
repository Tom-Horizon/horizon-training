.card.bad{border-color:#fca5a5;background:#fef2f2;color:#991b1b}</style></head><body><div class="top"><b>HORIZON EXTERIOR SOLUTIONS</b><h1 id="ttl">Installer Training</h1></div><div class="wrap" id="wrap"><div class="card">Loading...</div></div><script>var API="https://script.google.com/macros/s/AKfycbyiqYTWhfZnss6KsiVjzjVNnzZL8LsslGHjeBWW5IUTW_vQ232quj83NVFC0G9T8Yo1/exec",MANUAL="https://drive.google.com/file/d/1z0_zu4NaeYZaq5mJK1uxRt3YRyDCeuTh/view",SNAP_AT=1793718244811,SNAP={},QZ=[{"id":"P1","part":1,"title":"Class 2 - what it means","pages":"Field Standard 01 v1.1, page 1 (Class 2 - what it means)","questions":[{"q":"Which one starts fires?","type":"mc","options":["Volts","Amps","The data wire","The app"],"red":false,"ref":"Field Standard p.1, Volts do not start fires. Amps do.","s":"c50024073c544a42","h":["d92430e3698f17b181d8955e"]},{"q":"What is Class 2?","type":"mc","options":["A size of light","A safety rule that says a circuit can only carry a small amount of power, about 100 W","A grade of power supply that allows any number of lights","A colour setting in the app"],"red":false,"ref":"Field Standard p.1, What Class 2 means","s":"e86865a311be93f0","h":["db666d8f990160bf8de1b668"]},{"q":"What gauge is the wire built into our light strings?","type":"mc","options":["14 gauge - thick","16 gauge","18 gauge","20 gauge - thin, it can only take a few amps"],"red":false,"ref":"Field Standard p.1, Volts do not start fires","s":"3e9caeb86d0690ad","h":["a9de6c7146dabd8ae17ece92"]},{"q":"Which of these are true? (select all that apply)","type":"multi","options":["A breaker shuts the power off by itself when it sees too many amps","A circuit is one breaker, one wire, one group of lights","An injection is a spot where we feed fresh power into the run","PW (Pure White) uses the least power"],"red":false,"ref":"Field Standard p.1, Words you need","s":"70dbab94e356b13d","h":["a5879615954c4643fcb4a5e5"]},{"q":"You are planning a light circuit. What is the most amps that one circuit may carry? (amps)","type":"num","red":true,"unit":"A","ref":"Field Standard cover + p.1, Mark 3 chart","s":"1458da6546b3ab8a","h":["526142d103a6d05a6e78ef9c"]},{"q":"An old Mark 2 supply is 600 W at 24 V with nothing stopping it. About how many amps can it push out? (amps)","type":"num","red":false,"unit":"A","ref":"Field Standard p.1, Mark 1 / Mark 2 / Mark 3 chart","s":"94f365cfa74a194b","h":["e7cbb58f706979d5c5f96a53"]},{"q":"Your partner says \"It is only 24 volts, it cannot start a fire.\" What is the right answer?","type":"mc","options":["He is right - low volts are always safe","Wrong - amps start fires. Too many amps down a thin wire makes it hot, and hot enough it burns","Only 12 volt systems can start fires","Fires only start if the data wire is cut"],"red":false,"ref":"Field Standard p.1, Volts do not start fires. Amps do.","s":"da77656c6b7ec5ce","h":["4889ffd3a08eab76a586838f"]},{"q":"Someone suggests wiring a run of lights straight into the power supply with no breaker, \"because that is how the industry did it.\" What do you do?","type":"mc","options":["Do it - the supply protects the lights","Do it, but only on short runs","Do not do it - with no breaker the supply can push far more amps than the thin light wire can take. Every circuit gets its own breaker","Use a thicker feeder instead of a breaker"],"red":true,"ref":"Field Standard p.1, Why we made this booklet + Mark 1/2/3 chart (own breaker per circuit: p.5)","s":"e84710b8e5221f68","h":["4bd3bbaf37132d5599db14a8"]},{"q":"Our lights are built for Class 2 power only. What happens if you feed them from a big circuit with no 4 A limit?","type":"mc","options":["The safety rating means nothing - they expect a small circuit","Nothing - the lights protect themselves","They just get brighter","The app limits the power for you"],"red":true,"ref":"Field Standard p.1, What Class 2 means","s":"c8313dec3e338ffe","h":["6488c7fd6997b8c7dd8581ba"]},{"q":"What next? On a service call you open an older job and find the lights wired right into the power supply with no breaker. What do you do?","type":"mc","options":["Copy the same wiring on the next job so they match","Leave it and say nothing - nobody wants to get in trouble","Do not copy it. Report it so it gets fixed the new way - nobody is in trouble for old work","Add more lights to it while you are there"],"red":false,"ref":"Field Standard p.1, Why we made this booklet (handling old systems in detail: p.8)","s":"8a7d1a6754199c37","h":["547c05eb1a5bd2e091b058b3"]}]},{"id":"P2","part":2,"title":"Plan the job - the math","pages":"Sections 5-6","questions":[{"q":"How do you get the number of lights from the feet?","type":"mc","red":false,"options":["Feet x 1.5","Feet / 1.5","Feet x 3.28","Feet x 5"],"ref":"Section 6, step 1","s":"b00bfd61dac8b94d","h":["ad0397dfff981c6ad65edf96"]},{"q":"How do you get the number of circuits?","type":"mc","red":false,"options":["Lights / 50, round up","Lights / 56, round down","Feet / 60","Lights / 100"],"ref":"Section 6, step 2","s":"b99738d0adaaf2a2","h":["4cf7fc7aef346b720881e2fd"]},{"q":"What is the most amps allowed on one circuit?","type":"mc","red":true,"options":["3.2 A","4 A","5 A","20 A"],"ref":"Section 5, the five numbers","s":"84dd00460c985da9","h":["23ff0721b21bc5c5da4fac63"]},{"q":"Why do we count lights, not feet?","type":"mc","red":false,"options":["Feet change with spacing; the light count is what sets the amps","Feet are harder to measure","The app only shows lights","It does not matter"],"ref":"Section 5","s":"b01579a22b6491b2","h":["44ea8b334f28f1402c7cc01c"]},{"q":"A 150 ft house. How many circuits do you plan?","type":"num","red":false,"unit":"circuits","ref":"Section 6 example","s":"fde765b6baa7a4aa","h":["64257377a1b82d0a328beceb"]},{"q":"A 200 ft house. How many 600 W boxes do you quote?","type":"num","red":false,"unit":"boxes","ref":"Section 6 quick table","s":"d754231055b038b8","h":["3ec2707c3bcb2730dfb37982"]},{"q":"Someone planned 60 lights on one circuit. That pulls about 3.43 A on PW. What is the call?","type":"mc","red":true,"options":["Fine - under 4 A","Tight but OK","STOP - over 3.2 A, split the circuit","Add a booster"],"ref":"Section 5 table","s":"5fa38041be4fdff8","h":["b0aa08a249dc491f3be4d4b7"]},{"q":"The client wants a PRO / PLUS (4-output) controller. What changes in your plan?","type":"mc","red":false,"options":["Nothing","It uses 5 board circuits, leaving only 1 for injection - plan it at the quote","You get 10 circuits","You need no injections"],"ref":"Section 6, check the controller","s":"4e7542f5deb1a174","h":["801c6d71e98268c0f90420c4"]},{"q":"A 2-box job. Which are correct? (select all that apply)","type":"multi","red":false,"options":["Each box near its own GFCI plug","Each box gets its own Test C (whole-box test)","Both boxes share one controller","Add both boxes to the same Gouly app account"],"ref":"Section 6, two or more boxes","s":"683deab41c4feb7f","h":["2105c2880a679e9902b4cabd"]},{"q":"What next? The box is 45 ft from where the injection needs to go. What do you do?","type":"mc","red":false,"options":["Run 45 ft of 16/2 anyway","Feeder to an injection is 30 ft max - re-plan (move the box or injection) and call Ben if stuck","Use 20 gauge light wire","Skip the injection"],"ref":"Section 6 parts + Section 11","s":"f0420f7cd3c7fc4a","h":["95d21045f621877e9bdab916"]}]},{"id":"P3","part":3,"title":"Measure & quote","pages":"Sections 7-10","questions":[{"q":"When do you use the measuring wheel?","type":"mc","red":false,"options":["Only when the roofline is flat","On peaks and slopes","On every part of the house","Never"],"ref":"Section 7","s":"494b0daa093c9a2b","h":["f9758ece65d25ffdc6685d86"]},{"q":"iMark colours always go in this order:","type":"mc","red":false,"options":["Red = option 1 (base/front), Blue = option 2, Yellow = option 3 or special track","Blue, red, green","Any colour you like","Green = base"],"ref":"Section 8","s":"626bde4811343793","h":["a109c7702683cd65e34d9480"]},{"q":"What must be marked on the job photo? (select all that apply)","type":"multi","red":false,"options":["Every roofline in the job","A dot at every injection (every 50 lights)","The light count between dots","Where the box goes"],"ref":"Section 8","s":"40a3a60dbeeab5be","h":["4f1da9643f3a3660969c96e6"]},{"q":"In a Jobber quote, which lines get \"Set as option\" AND \"Recommend line item\" turned on?","type":"mc","red":false,"options":["Every option line, not the front/base line","Only the base line","No lines","Only the power box"],"ref":"Section 10","s":"60469385a74774e6","h":["1f707aa4632055632926d36c"]},{"q":"A peak has 30 pieces of 4-inch soffit. How many feet is that?","type":"num","red":false,"unit":"ft","ref":"Section 7, soffit math","s":"5d3bca376c66e428","h":["fc35188a0be4c9dd560fd672"]},{"q":"The roofline has a gutter covering the wall. What do you do?","type":"mc","red":false,"options":["Quote hat track","Gutter track (+$2.50/ft) - call Ben before you quote","Glue track to the gutter","Skip that side"],"ref":"Section 9","s":"76ddbbc985628b13","h":["32c9d67d5fed335dcc809d98"]},{"q":"The client wants the front and back lit, but not the sides. How many boxes?","type":"mc","red":false,"options":["1","At least 2 - signal can't run down the side of a house","3","None"],"ref":"Section 9, how many boxes","s":"917b199b5ffb8878","h":["9a7f2c0923193cbbb21a7e29"]},{"q":"Stucco house. Where does the box go first?","type":"mc","red":false,"options":["On the stucco","Back fascia board first, then in-garage (+$200), stucco last","Inside the attic","Hidden under the siding"],"ref":"Section 9, where the box goes","s":"b0c5913117e27b40","h":["a9b19228c33ed53ad49e3d73"]},{"q":"The client wants 4 channels (zones). How much extra do you add to the quote? (dollars)","type":"num","red":false,"unit":"$","ref":"Section 8, channels","s":"7726b64b8c7010a4","h":["229fa1804387ef3dc9974777"]},{"q":"What next? The client wants an add-on (the garage). How do you measure and quote it?","type":"mc","red":false,"options":["Include it in the total feet","Measure everything else first, then measure the add-on by itself as its own Jobber line","Guess it from the photo","Leave it for the crew"],"ref":"Section 7, quoting an add-on","s":"eaf4949cbd5744c1","h":["80805ec7c08328fa5adc6ad1"]}]},{"id":"P4","part":4,"title":"Install it","pages":"Sections 11-14","questions":[{"q":"Our standard feeder wire is FT-4 stranded __/2. What gauge number goes in the blank?","type":"num","red":false,"unit":"gauge","ref":"Section 11","s":"539b9afbce06a94d","h":["ea2aef23d3bef5fc75fa9e3c"]},{"q":"At every injection, what do you cut?","type":"mc","red":true,"options":["The + (positive) wire - never the data wire","The data wire","Both wires","Nothing"],"ref":"Section 13","s":"e0d2f48f29b2ceb7","h":["fac945fd564b2781d697500e"]},{"q":"How are feeders and breakers set up?","type":"mc","red":true,"options":["One feeder per injection, each on its own 4 A breaker","One feeder can feed 2-3 injections","Lights straight to the supply","One big breaker for the whole box"],"ref":"Section 13","s":"0bee9ebe575ffcbf","h":["641acfbff40b87462db2b008"]},{"q":"Where are WAGOs allowed?","type":"mc","red":false,"options":["Inside the box only","Outside on the roof","In the track","Anywhere if taped"],"ref":"Section 11","s":"cf8f768234743e8c","h":["c99c0942386ac46a28833fee"]},{"q":"You are connecting a 40-light run. Your partner says \"just plug it in, it's only 24 V.\" What happens if you plug in live?","type":"mc","red":true,"options":["Nothing","It can kill the chip in the light before the one you touched - a callout we pay for. Power off first","The lights get brighter","Only the end cap fails"],"ref":"Section 11, never plug in live","s":"82639a01ccbad0c2","h":["a0300f691b80e70a2957e0ad"]},{"q":"You need to run wire through a wall. The spool has no ETL, CSA or UL number printed on it. What do you do?","type":"mc","red":false,"options":["Use it anyway","Do not run it through the wall - use FT-4 with a printed listing number","Tape over it","Use solid wire instead"],"ref":"Section 11","s":"2148b95a2b26e283","h":["61f02a2240cadb75e4261959"]},{"q":"Screwing up track. Which are correct? (select all that apply)","type":"multi","red":false,"options":["Clean the fascia first","Pre-drill pilot holes","Stainless or zinc screws, every 3-4 ft","Drywall screws are fine","Glue is fine on vinyl siding"],"ref":"Section 12","s":"4f3fa582e0c0917f","h":["3808f486bc3cc8265ac134ad"]},{"q":"You are running a feeder from the box to an injection. What is the longest it can be, in feet?","type":"num","red":false,"unit":"ft","ref":"Section 11","s":"ea7d3a2cf17384c3","h":["fa87693dcc4d2b422ed64d0d"]},{"q":"There is an extension over 10 ft to cross a gable. What else do you add?","type":"mc","red":false,"options":["A signal booster before it","A bigger breaker","Nothing","Another power box"],"ref":"Section 4, put up the lights step 6","s":"07d0c318561e981b","h":["972dc9a8fc9aba2d6dd64eac"]},{"q":"What next? You open a box and see one 14/2 feeding three injections with no breakers. What do you do?","type":"mc","red":false,"options":["Leave it","That is wrong - stop, tell Ben, it needs a proper retrofit","Add more lights","Swap in a bigger breaker"],"ref":"Section 14 + Section 17","s":"a8ed91116d20d035","h":["0dfb09e250c981934fe7a95b"]}]},{"id":"P5","part":5,"title":"Test before you leave","pages":"Section 15","questions":[{"q":"All three tests are done on:","type":"mc","red":false,"options":["Pure White, full bright","Red","Any colour","Lights off"],"ref":"Section 15","s":"01b9cae4a32d3e27","h":["d91f06b6f4131c8447673130"]},{"q":"For Test A, where does the clamp meter go?","type":"mc","red":false,"options":["Around the + feeder of one circuit, one wire only","Around both wires","On the wall plug","On the data wire"],"ref":"Section 15, Test A","s":"179b1b12ff44031f","h":["dd32691577a356cba26ae109"]},{"q":"What is the lowest allowed voltage at the last light (Test B)?","type":"mc","red":false,"options":["22.8 V","20 V","24 V","12 V"],"ref":"Section 15, Test B","s":"1d5da9dd6cf1b816","h":["7d718454a5e0dea6399cac77"]},{"q":"What does \"No meter, no install\" mean?","type":"mc","red":false,"options":["No job is finished without metering every circuit","Meters are optional","Only big jobs get tested","The office tests later"],"ref":"Section 15","s":"751aa5cc71ce831f","h":["d58bc040bd18447b17b4b769"]},{"q":"Test A reads 3.1 A on a circuit. What do you do?","type":"mc","red":false,"options":["PASS - move on","TIGHT - OK, but write \"FULL\" so no lights are ever added","FAIL - split it","Add a bigger breaker"],"ref":"Section 15, pass or fail","s":"1d4120b5d606f2c5","h":["d3d4d28bc034e18def125c38"]},{"q":"Test A reads 3.4 A. What do you do?","type":"mc","red":false,"options":["PASS","Write FULL","FAIL - too many lights, split it or add an injection before you leave","Ignore it"],"ref":"Section 15, pass or fail","s":"9f9b588b651d59f6","h":["573239636ff1ffeddab12fc8"]},{"q":"Test B reads 22.4 V at the last light. What does it mean?","type":"mc","red":false,"options":["Fine","The injection is too far away - move it closer or add one","The box is too big","Bad app setting"],"ref":"Section 15","s":"88704574a5818240","h":["ee8aa9f5156b343cd6866386"]},{"q":"Test C: five circuits read 2.9, 2.8, 3.0, 2.7 and 2.9 A. What is the total box amps?","type":"num","red":false,"unit":"A","ref":"Section 15, Test C","s":"d96c8d255763741a","h":["fbed6b073bf093f3b95c7259","9b90dcf1b4d6a647e798210d","62c622df131911378b538066","d6691e9e8c1a78522d653dae","300c8163c15c87bc191016ef","4fd360825c38e3287dc4f304","9d64efc077e74ef9ff6a3293","3efa9812fae6839f69b0fa77","490db269915de8a0a2110d1a","9f42a0754669435e5101f546","888bb6c4604b4dcec5fa7dca"]},{"q":"What is the most total amps allowed on a 600 W box (Test C)?","type":"num","red":false,"unit":"A","ref":"Section 15, Test C","s":"ce318a4555e55e2c","h":["4c59f86b6c7e43a3aedf8f2a"]},{"q":"What next? Tests are all done and passing. What do you do with the results?","type":"mc","red":false,"options":["Nothing","Write them on the test sheet (one per box) and leave it with the job file","Text them to a friend","Keep them in your head"],"ref":"Section 15, test sheet","s":"243b73a51cc396f0","h":["e504e012f56ffcfe9642a485"]}]},{"id":"P6","part":6,"title":"Fix problems & old systems","pages":"Sections 16-17","questions":[{"q":"Lights at the end of a run look dim or yellow. Why?","type":"mc","red":false,"options":["Voltage drop - too far from the last injection","Bad app","Too few lights","The booster is backwards"],"ref":"Section 16","s":"9a5fc77e71c7a4a6","h":["340618d14aa3c91bec0375cb"]},{"q":"Solid white lights usually mean:","type":"mc","red":false,"options":["A signal booster is missing or dead","Too much power","Wrong colour picked","A tripped breaker"],"ref":"Section 16","s":"5d59250dce20d200","h":["5d29df198636bc3b72a5fe11"]},{"q":"How do you spot a Mark 3 (current standard) box?","type":"mc","red":false,"options":["Gouly box, new board, 6 breakers at 4 A each","Surf-light box, 12 V","Two 5 A breakers","No breakers"],"ref":"Section 17","s":"7d11c2cb422ef692","h":["9938add9010d58547135d24e"]},{"q":"Flickering usually means:","type":"mc","red":false,"options":["Two power flows meeting - check the + is cut at the injection","Too few lights","App needs an update","Low WiFi"],"ref":"Section 16","s":"f7f906e1e3e945bd","h":["3900a481ba54027c30e8aecd"]},{"q":"A section of lights is solid blue. What do you check first?","type":"mc","red":false,"options":["Every connector (+ to +) and that the booster arrow points to the lights","Swap the power box","Raise the breaker size","Delete the app"],"ref":"Section 16","s":"78f0bc305ee3b929","h":["aa9ddfe6548f4097f0613d96"]},{"q":"A breaker trips on PW. You count 66 lights on that circuit. At least how many lights must come off it to reach the maximum allowed?","type":"num","red":false,"unit":"lights","ref":"Section 16 + Section 5","s":"9e43001f4a6da177","h":["20e10c834  var parts=ST.parts.map(function(p){return{z:zOf(p.id),s:partState(p)};}).filter(function(x){return x.z;}).sort(function(a,b){return a.z.part-b.z.part;});
 var done=parts.filter(function(x){return x.s.state==="passed";}).length;
 var h='<div class="card"><p style="margin:0">Hi '+esc(ST.first)+', this is your training portal. Each part is a short animated video, then its quiz. Watch the video, then take the quiz. Pass all 8 to become a Horizon Certified Installer.</p><p class="muted">Quizzes are 10 questions each, about 10 minutes. Pass = 90% and every <span class="red">SAFETY</span> question right. You can retake any part, even after you pass; your best score is kept. <a href="'+MANUAL+'" target="_blank" rel="noopener">Open the manual</a>.</p><p style="margin:0"><b>'+done+' of 8 passed</b>'+(done===8?' 🎓 Certified':'')+'</p>'+(LIVE?'':'<p class="muted">(Showing saved progress. Your results still count.)</p>')+'</div>';
 parts.forEach(function(x){var s=x.s,z=x.z,ok=s.state==="passed",tag;
  if(ok)tag='<span class="tag ok">Passed '+esc(s.score)+'</span>';
  else tag=s.due?'<span class="tag '+(s.overdue?'bad">Overdue — was due ':'open">Due ')+esc(fmtD(s.due))+'</span>':'<span class="tag open">Open</span>';
  h+='<a class="card part'+(ok?' done':'')+'" href="#/part/'+z.part+'"><span class="pnum">'+(ok?'✓':z.part)+'</span><span class="pbody"><b>Part '+z.part+': '+esc(z.title)+'</b><span class="muted">'+(vdone(z,pOf(z.id))&&VIDEO_BASE?'Video watched · ':'')+'Manual: '+esc(z.pages)+'</span>'+tag+'</span><span class="chev">›</span></a>';});
 show("Installer Training",h);return false;}
function route(){if(!ST)return;var m=location.hash.match(/^#\/part\/(\d)/);if(m)partPage(+m[1]);else{var o=location.hash.match(/^#(P\d)/);if(o)quiz(o[1]);else home();}}
window.addEventListener("hashchange",route);
function canon(q,a){if(q.type==="num"){var x=parseFloat(String(a).replace(/[^0-9.\-]/g,""));return isFinite(x)?x.toFixed(2):"";}return a.slice().sort(function(x,y){return x-y;}).join(",");}
document.addEventListener("submit",function(e){var f=e.target;if(f.id!=="f")return;e.preventDefault();if(VP&&VP.locked)return;var wasPassed=(function(){var p=pOf(f.getAttribute("data-q"));return p&&partState(p).state==="passed";})();var z=QZ.filter(function(x){return x.id===f.getAttribute("data-q");})[0],a=[],miss=0;
 z.questions.forEach(function(q,i){var els=document.getElementsByName("q"+i);if(q.type==="num"){a.push(els[0].value);if(els[0].value==="")miss++;}else{var v=[];for(var k=0;k<els.length;k++)if(els[k].checked)v.push(+els[k].value);a.push(v);if(!v.length)miss++;}});
 if(miss&&!confirm(miss+" question(s) are blank. Submit anyway?"))return;var wasPassedNow=wasPassed;$("go").disabled=true;$("msg").textContent="Checking...";
 Promise.all(z.questions.map(function(q,i){var c=canon(q,a[i]);return c===""?Promise.resolve(false):sha(q.s+"|"+c).then(function(hx){return q.h.indexOf(hx.slice(0,24))>=0;});}))
 .then(function(ok){var right=0,redOk=true,missed=[];ok.forEach(function(o,i){if(o)right++;else{if(z.questions[i].red)redOk=false;missed.push(i);}});
  var pass=right/z.questions.length>=0.9&&redOk,score=right+"/"+z.questions.length;
  return apiGet({api:"submit",q:z.id,a:JSON.stringify(a)}).then(function(r){if(!r.ok){if(r.error==="signin"){signin("Your session ended. Please sign in again.");throw 0;}throw new Error(r.error);}
  var R=r.res||{};if(R.refused){$("go").disabled=false;$("msg").innerHTML="";$("res").innerHTML='<div class="card bad">'+esc(R.refused)+'</div>';throw 0;}
  pass=!!R.pass;score=R.score||score;if(R.redOk!==undefined)redOk=!!R.redOk;refresh();
  var h='<div class="card"><h2 style="margin:0 0 6px">'+(pass?"✅ Passed":"❌ Not passed yet")+'</h2><p style="margin:0">Score '+score+(redOk?"":' · you missed a <span class="red">SAFETY</span> question (these must all be right)')+'</p>'+(pass?"":wasPassed?'<p class="muted">No worries: this part stays passed and your best score is kept.</p>':'<p class="muted">You can retry right away, as many times as you need. Check the questions below first.</p>')+'</div>';
  if(missed.length)h+='<div class="card"><b>Questions to review</b>'+missed.map(function(i){var q=z.questions[i];return'<p><b>Q'+(i+1)+'.</b> '+esc(q.q)+(q.red?' <span class="red">SAFETY</span>':'')+'<br><span class="muted">Manual: '+esc(q.ref||"")+'</span></p>';}).join("")+'</div>';
  h+='<p><a class="btn" href="#/">Back to all parts</a></p>';f.style.display="none";$("res").innerHTML=h;window.scrollTo(0,0);});})
 .catch(function(err){if(err===0)return;$("go").disabled=false;$("msg").textContent="Could not check: "+(err&&err.message||err);});});
function shuf(opts){var idx=[],last=[];opts.forEach(function(o,j){(/^(all|none) of (the |these )?(above|these)|^both of (the )?above$|^both$/i.test(String(o).trim())?last:idx).push(j);});for(var k=idx.length-1;k>0;k--){var r=Math.floor(Math.random()*(k+1)),t=idx[k];idx[k]=idx[r];idx[r]=t;}return idx.concat(last);}
function dead(m){show("Installer Training",'<div class="card">'+m+'</div>');}
function refresh(){return liveStatus().then(function(r){if(r.ok){ST={first:r.s.first,parts:r.s.parts};TH=r.s.uid;}return r;}).catch(function(){});}
function topbar(){var b=$("so");if(!b){b=document.createElement("button");b.id="so";b.className="signout";b.textContent="Sign out";b.onclick=signout;document.querySelector(".top").appendChild(b);}b.style.display=sess()?"":"none";}
function signout(){var s0=sess();clearSess();ST=null;if(s0)apiPost({api:"logout",s:s0}).catch(function(){});history.replaceState(null,"",location.pathname);signin("You are signed out.");}
function authCard(t,inner,note){show(t,'<div class="card auth">'+(note?'<p class="muted">'+esc(note)+'</p>':'')+inner+'<p id="am" class="err"></p></div>');topbar();}
function busy(b,on){b.disabled=on;b.textContent=on?"Please wait...":b.getAttribute("data-l");}
function pwField(id,ph){return '<label class="fl">'+ph+'<input type="password" id="'+id+'" autocomplete="'+(id==="pw"?"current-password":"new-password")+'" required></label>';}
function signin(note){ST=null;var em="";authCard("Sign in",'<form id="af"><label class="fl">Email<input type="email" id="em" autocomplete="username" required value="'+esc(em)+'"></label>'+pwField("pw","Password")+'<button type="submit" id="ab" data-l="Sign in">Sign in</button></form><p><a href="#" id="fg">Forgot password?</a></p>',note);
 $("af").onsubmit=function(e){e.preventDefault();var b=$("ab");busy(b,true);$("am").textContent="";apiPost({api:"login",email:$("em").value,pw:$("pw").value}).then(function(r){busy(b,false);if(!r.ok)return $("am").textContent=r.error;setSess(r);start();}).catch(function(x){busy(b,false);$("am").textContent="Could not reach the server. Try again.";});};
 $("fg").onclick=function(){forgot($("em").value);return false;};}
function forgot(em){authCard("Forgot password",'<form id="af"><p>Enter the email address Horizon has on file for you. We will email you a link to set a new password.</p><label class="fl">Email<input type="email" id="em" required value="'+esc(em||"")+'"></label><button type="submit" id="ab" data-l="Email me a reset link">Email me a reset link</button></form><p><a href="#" id="bk">Back to sign in</a></p>');
 $("bk").onclick=function(){signin();return false;};
 $("af").onsubmit=function(e){e.preventDefault();var b=$("ab");busy(b,true);apiPost({api:"forgot",email:$("em").value}).then(function(){busy(b,false);$("af").innerHTML='<p>If that email is on file, a reset link is on its way. It works for 1 hour. Check your spam folder too.</p>';}).catch(function(){busy(b,false);$("am").textContent="Could not reach the server. Try again.";});};}
function newPw(title,intro,send){authCard(title,'<form id="af"><p>'+intro+'</p>'+pwField("p1","New password (8 characters or more)")+pwField("p2","Type it again")+'<label class="sh"><input type="checkbox" id="shw"> Show password</label><button type="submit" id="ab" data-l="Save password">Save password</button></form>');
 $("shw").onchange=function(){$("p1").type=$("p2").type=this.checked?"text":"password";};
 $("af").onsubmit=function(e){e.preventDefault();var a=$("p1").value;if(a.length<8)return $("am").textContent="Use at least 8 characters.";if(a!==$("p2").value)return $("am").textContent="The two passwords don't match.";
  var b=$("ab");busy(b,true);send(a).then(function(r){busy(b,false);if(!r.ok)return $("am").textContent=r.error;setSess(r);history.replaceState(null,"",location.pathname);start();}).catch(function(){busy(b,false);$("am").textContent="Could not reach the server. Try again.";});};}
function start(){topbar();show("Installer Training",'<div class="card">Loading your training...</div>');
 var s0=sess();refresh().then(function(r){if(sess()!==s0)return;if(r&&r.ok){LIVE=true;topbar();if(P.get("q"))quiz(P.get("q"));else route();}
  else if(r&&r.error==="signin"){clearSess();signin("Please sign in.");}
  else dead("Could not load your progress ("+esc(r&&r.error||"no connection")+"). Please try again in a minute.");});}
(function boot(){var rc=P.get("reset");
 if(rc)return newPw("Set a new password","Choose a new password for your training portal.",function(pw){return apiPost({api:"reset",code:rc,pw:pw});});
 if(sess())return start();
 if(!T)return signin();
 authCard("Installer Training",'<p>Loading...</p>');
 apiPost({api:"auth",t:T}).then(function(r){if(!r.ok)return dead(esc(r.error));
  if(r.hasPw)return signin("Welcome back, "+r.first+". Sign in with your email and password.");
  newPw("Create your password","Hi "+esc(r.first)+", welcome to Horizon training. Create a password for your training portal. Next time, you will sign in with your email address and this password.",function(pw){return apiPost({api:"setpw",t:T,pw:pw});});})
 .catch(function(){dead("Could not reach the server. Please try again in a minute.");});})();
