d4c885ce4b4b"]},{"q":"What next? When assessing a different company's system or one of our old systems, you find lights wired straight into the power supply with no breaker. What do you do?","type":"mc","options":["Wire your new run the same way so the house matches","Fit a 4 A breaker on it yourself right there, since that is the rule","Leave it as it is, note the address, and tell your crew lead so it gets booked to be fixed - nobody is in trouble for old work","Add the lights you came for - it was working before"],"red":false,"ref":"Part 1 video: every circuit gets its own breaker (old systems in detail: Part 7)","s":"e23128aebb7c5c1c","h":["95439a0aebfef34e555190f4"]}]},{"id":"P2","part":2,"title":"Plan the job - math and limits","pages":"Part 2 video · Field Standard 01 v1.1, pages 2-3","questions":[{"q":"A light's sticker says 0.96 W, but we plan with 1.37 W. Why?","type":"mc","options":["On Pure White all three colours are on at once, so it really pulls about 43% more","It adds a safety margin for long feeders","1.37 W is the number for 12 volt systems","The sticker is for half brightness"],"red":false,"ref":"Part 2 video: The Pure White trap","s":"160258fd9eb7191a","h":["32cd58d9fe4e6e1e1115c9bb"]},{"q":"A roofline run measures 130 feet. At our 8 inch spacing, how many lights is that? (lights)","type":"num","red":false,"unit":"lights","ref":"Part 2 video: Step 1 (feet × 1.5)","s":"78d1d3736e128c60","h":["cb59271d192d3c51111934f4"]},{"q":"You're mapping a job before you're on the ladder: 280 lights in total. How many light circuits does it need? (circuits)","type":"num","red":true,"unit":"circuits","ref":"Part 2 video: Step 2 (280 ÷ 60 = 4.67, round up)","s":"223175cf410c394b","h":["e05b300b85f654b700120a8f"]},{"q":"One circuit will carry 64 lights. About how many amps will it pull on Pure White? (amps, one decimal)","type":"num","red":false,"unit":"A","ref":"Part 2 video: Steps 3 and 4 (64 × 1.37 = 88 W, ÷ 24)","s":"6bc3aa492e50c7ad","h":["609d8fbfe0fd5984d3
