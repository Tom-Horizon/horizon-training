;border-radius:4px}.vprog i{position:absolute;left:0;top:0;bottom:0;background:#f5c26b;border-radius:4px}.vprog b{position:absolute;top:-3px;width:4px;height:14px;background:#fff;border-radius:2px;margin-left:-2px}#vvol{width:70px}@media(max-width:480px){#vvol{display:none}}.vwrap.cssfs{position:fixed;inset:0;z-index:9999;border-radius:0;display:flex;flex-direction:column;justify-content:center}.vwrap.cssfs video{max-height:none;flex:1}.vwrap:fullscreen{display:flex;flex-direction:column;justify-content:center}.vwrap:fullscreen video{max-height:none;flex:1}.locked{border:2px dashed #cbd5e1;text-align:center}.pbar{height:10px;background:#e5e7eb;border-radius:5px;margin:10px 0 6px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:#f5c26b}.sect{margin:0 0 8px;font-size:17px}

.auth select,.auth input[type=date],.dled select,.dled input[type=date]{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:12px;font-size:16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}</style></head><body><div class="top"><b>HORIZON EXTERIOR SOLUTIONS</b><h1 id="ttl">Installer Training</h1></div><div class="wrap" id="wrap"><div class="card">Loading...</div></div><script>var API="https://script.google.com/macros/s/AKfycbyiqYTWhfZnss6KsiVjzjVNnzZL8LsslGHjeBWW5IUTW_vQ232quj83NVFC0G9T8Yo1/exec",MANUAL="https://drive.google.com/file/d/1z0_zu4NaeYZaq5mJK1uxRt3YRyDCeuTh/view",C2MANUAL="https://drive.google.com/file/d/1NT46kj8XTduQY_uARL0bqFQItzLs2Xuz/view",SNAP_AT=1793718244811,SNAP={},QZ=[{"id":"P1","part":1,"title":"Class 2 - what it means","pages":"Field Standard 01 v1.1, page 1 (Class 2 - what it means)","questions":[{"q":"Which one starts fires?","type":"mc","options":["Volts","Amps","The data wire","The app"],"red":false,"ref":"Field Standard p.1, Volts do not start fires. Amps do.","s":"c50024073c544a42","h":["d92430e3698f17b181d8955e"]},{"q":"What is Class 2?","type":"mc","options":["A size of light","A safety rule that says a circuit can only carry a small amount of power, about 100 W","A grade of power supply that allows any number of lights","A colour setting in the app"],"red":false,"ref":"Field Standard p.1, What Class 2 means","s":"e86865a311be93f0","h":["db666d8f990160bf8de1b668"]},{"q":"What gauge is the wire built into our light strings?","type":"mc","options":["14 gauge - thick","16 gauge","18 gauge","20 gauge - thin, it can only take a few amps"],"red":false,"ref":"Field Standard p.1, Volts do not start fires","s":"3e9caeb86d0690ad","h":["a9de6c7146dabd8ae17ece92"]},{"q":"Which of these are true? (select all that apply)","type":"multi","options":["A breaker shuts the power off by itself when it sees too many amps","A circuit is one breaker, one wire, one group of lights","An injection is a spot where we feed fresh power into the run","PW (Pure White) uses the least power"],"red":false,"ref":"Field Standard p.1, Words you need","s":"70dbab94e356b13d","h":["a5879615954c4643fcb4a5e5"]},{"q":"You are planning a light circuit. What is the most amps that one circuit may carry? (amps)","type":"num","red":true,"unit":"A","ref":"Field Standard cover + p.1, Mark 3 chart","s":"1458da6546b3ab8a","h":["526142d103a6d05a6e78ef9c"]},{"q":"An old Mark 2 supply is 600 W at 24 V with nothing stopping it. About how many amps can it push out? (amps)","type":"num","red":false,"unit":"A","ref":"Field Standard p.1, Mark 1 / Mark 2 / Mark 3 chart","s":"94f365cfa74a194b","h":["e7cbb58f706979d5c5f96a53"]},{"q":"Your partner says \"It is only 24 volts, it cannot start a fire.\" What is the right answer?","type":"mc","options":["He is right - low volts are always safe","Wrong - amps start fires. Too many amps down a thin wire makes it hot, and hot enough it burns","Only 12 volt systems can start fires","Fires only start if the data wire is cut"],"red":false,"ref":"Field Standard p.1, Volts do not start fires. Amps do.","s":"da77656c6b7ec5ce","h":["4889ffd3a08eab76a586838f"]},{"q":"Someone suggests wiring a run of lights straight into the power supply with no breaker, \"because that is how the industry did it.\" What do you do?","type":"mc","options":["Do it - the supply protects the lights","Do it, but only on short runs","Do not do it - with no breaker the supply can push far more amps than the thin light wire can take. Every circuit gets its own breaker","Use a thicker feeder instead of a breaker"],"red":true,"ref":"Field Standard p.1, Why we made this booklet + Mark 1/2/3 chart (own breaker per circuit: p.5)","s":"e84710b8e5221f68","h":["4bd3bbaf37132d5599db14a8"]},{"q":"Our lights are built for Class 2 power only. What happens if you feed them from a big circuit with no 4 A limit?","type":"mc","options":["The safety rating means nothing - they expect a small circuit","Nothing - the lights protect themselves","They just get brighter","The app limits the power for you"],"red":true,"ref":"Field Standard p.1, What Class 2 means","s":"c8313dec3e338ffe","h":["6488c7fd6997b8c7dd8581ba"]},{"q":"What next? On a service call you open an older job and find the lights wired right into the power supply with no breaker. What do you do?","type":"mc","options":["Copy the same wiring on the next job so they match","Leave it and say nothing - nobody wants to get in trouble","Do not copy it. Report it so it gets fixed the new way - nobody is in trouble for old work","Add more lights to it while you are there"],"red":false,"ref":"Field Standard p.1, Why we made this booklet (handling old systems in detail: p.8)","s":"8a7d1a6754199c37","h":["547c05eb1a5bd2e091b058b3"]}]},{"id":"P2","part":2,"title":"Plan the job - math and limits","pages":"Field Standard 01 v1.1, pages 2-3 (The math; The limits)","questions":[{"q":"Why does a light pull so much more on Pure White than the sticker says?","type":"mc","options":["On Pure White all three colours turn on at once","Pure White runs at 12 volts","The sticker is for the box, not the light","Pure White turns the breaker off"],"red":false,"ref":"Field Standard p.3, The Pure White trap","s":"ef1ee7dd112f3ea2","h":["f6f1d9add01fbade07a0b028"]},{"q":"Where do the planning numbers come from? (select all that apply)","type":"multi","options":["1.5 is lights per foot at our 8 inch spacing","1.37 is what one light really pulls (watts) on Pure White","24 is our system voltage","24 is the most amps one circuit can carry"],"red":false,"ref":"Field Standard p.2, Where the numbers come from","s":"ba45b9c39a1a284d","h":["236165634c229c24d826b5b6"]},{"q":"At the quote you measure 200 feet of roofline. How many lights is that? (lights)","type":"num","red":false,"unit":"lights","ref":"Field Standard p.2, step 1 (feet x 1.5); 200 x 1.5 = 300","s":"9b674db049e27864","h":["99f6adf55aa1edb259b9aac6"]},{"q":"A job needs 250 lights. Using lights / 60, rounded up, how many circuits does it need? (circuits)","type":"num","red":true,"unit":"circuits","ref":"Field Standard p.2, step 2 (lights / 60, round up); 250 / 60 = 4.17, round up = 5","s":"4a38669023626cd5","h":["84ba88200de9d66e45465505"]},{"q":"One circuit has 60 lights on it. Using lights x 1.37, then watts / 24, about how many amps does it pull on Pure White? (amps, one decimal)","type":"num","red":false,"unit":"A","ref":"Field Standard p.2, steps 3 and 4; 60 x 1.37 = 82 W, 82 / 24 = 3.4 A (p.3 table: 60 lights = 3.43 A)","s":"8f1905866dd1435a","h":["b9e9facab62cad3f80c9ed08","eb4ca389163bb077d956bf88","7966d278aa816b136fe3b0b2","f907a8e71c7b417342a06ac8","917ab2e17a9be02621acb6af","374f2bff379962802584ec89","6cd683382a9076442a3e8df2","30ba12cbc9869432eb3ed170","6ad3ec8e63e47d6cd457df21","0ae9e916754267eba52aca77","ac54d6a0d77343c83f00b464","1b76a990c470937e5f0ad551","2bdf5dbd660343ecbe4b69ab","54845db4008cf42afce3df46","68b75f723c7dc23959182dca","9510af747ea5e1a44f043389","351d2239e04a29b93be233c9","876ac5dda92ff6ecffbbb809","f5d4880326330045fd865b1d","94bb616ca91da20d9ad9d2be","b03e3c92ccbd07c00d94fe72"]},{"q":"Your plan shows one circuit at 4.6 amps. What do you do?","type":"mc","options":["Nothing - 4.6 is close enough","Use a bigger breaker on that circuit","Add a circuit - the answer must be 4.0 A or less","Plan it on a colour instead of Pure White"],"red":true,"ref":"Field Standard p.2, Planning a job (Answer must be 4.0 A or less. If it is more, add a circuit.)","s":"6ddb4de84635c7dc","h":["b22c3d60c8554a1dc804597a"]},{"q":"The job uses a controller with 4 outputs. The board has 6 circuits. How many circuits are left for injection?","type":"mc","options":["6","1","5","4"],"red":false,"ref":"Field Standard p.2, Check the controller before you count circuits (4 outputs: uses 5, leaves 1)","s":"a644d93b9456b23a","h":["8cacf664e18a42a947bf98b2"]},{"q":"What is the most lights you may ever put on one circuit? (lights)","type":"num","red":true,"unit":"lights","ref":"Field Standard p.3, limits (70 lights - the most. Never go past it.)","s":"85707a19781a4cd8","h":["bf5cc6107554d4c23fd664cd"]},{"q":"A crew member says \"just put an injection every 65 feet, like we always did.\" What is right?","type":"mc","options":["That is fine at 8 inch spacing","Only if the run is on one roofline","Yes, as long as you use 14/2 wire","No - at 8 inch spacing 60 to 70 feet is 90 to 105 lights, way over 4 amps. Inject every 60 lights, never more than 70"],"red":true,"ref":"Field Standard p.3, Count lights. Never count feet. (old rule vs new rule)","s":"9204753c7b67c1de","h":["caeaae5d492363c75df4c85f"]},{"q":"You are about to do the amp test on a finished run. Which setting do you test on?","type":"mc","options":["Red, because it is brightest","BW, because it has blue in it","PW - the far-left white in the app","Whatever colour the customer likes"],"red":true,"ref":"Field Standard p.3, Always test on PW (Not BW. BW has blue in it and pulls less.)","s":"893932a548b40977","h":["ad5ce7a84cddc0fc33cfdc1c"]}]},{"id":"P4","part":3,"title":"Wire, parts and water","pages":"Field Standard 01 v1.1, page 4 (Wire and parts)","questions":[{"q":"Which wire is the weakest wire in the system - the one everything else protects?","type":"mc","options":["The 20 gauge wire built into the light string","The 14/2 feeder","The 16/2 feeder","The wire inside the supply"],"red":false,"ref":"Field Standard p.4, The light string is the weakest wire","s":"516222dba1655500","h":["a2325e623b8f6ddbe8257ad6"]},{"q":"How does wire gauge work?","type":"mc","options":["Thicker wire has a bigger gauge number","Gauge is only the colour of the jacket","All gauges carry the same amps","Thicker wire has a smaller gauge number"],"red":false,"ref":"Field Standard p.4, Thicker wire has a smaller gauge number","s":"f8d2e5d7ab0c2473","h":["a075a8532a7f0ab8760b783c"]},{"q":"What do we use for the feeder from the box to an injection? (select all that apply)","type":"multi","options":["16/2 or 18/2","Solid core copper","FT-4 rated","Stranded copper"],"red":false,"ref":"Field Standard p.4, wire by location (Feeder to an injection: 16/2 or 18/2, FT-4, stranded; never solid core)","s":"c3ebc88e3a05f63a","h":["20bfabbdd73a930bc68f8223"]},{"q":"What actually seals a light against water?","type":"mc","options":["The plastic body","The little O-ring - grease it","Tightening the barrel as hard as you can","Tape over the joint"],"red":false,"ref":"Field Standard p.4, Keeping water out","s":"85c804b49cfb4d9d","h":["5d9b0fb3bad07946afcc9d30"]},{"q":"You need to run feeder through a wall. The spool is FT-4 but has no ETL, CSA or UL number printed on the jacket. What do you do?","type":"mc","options":["It does not go through a wall. No exceptions - ask Ben if you are not sure","Use it - FT-4 is enough","Use it if it is 14/2","Wrap it in tape and use it"],"red":true,"ref":"Field Standard p.4, Through a wall (FT-4 with an ETL, CSA or UL number printed on the jacket... No printed number, it does not go through a wall. No exceptions.)","s":"a31ebb38456d6e74","h":["4431ee6158889d4c3c23cc1f"]},{"q":"You need to plug a light into a run of 40 lights. What do you do first?","type":"mc","options":["Plug it in live so you can see it light up","Switch the app to PW","Shut the power off at the box first","Unplug the controller only"],"red":true,"ref":"Field Standard p.4, Never plug in with the power on (Shut the power off at the box first. Every time. Power off. Plug in. Power on. Test.)","s":"d448c0c65d263e7d","h":["924fbc5a3a06012db69ddf7c"]},{"q":"We tested 50 feet of 20 gauge wire: 24.1 V in and 22.7 V out. How many volts were lost? (volts)","type":"num","red":false,"unit":"V","ref":"Field Standard p.4, Long runs lose volts (24.1 V in, 22.7 V out, -1.4 V)","s":"fbec5f1ec0da8a5a","h":["a80e565ef0b1282ddf427a16","0c3eaccfd6b280f87075fbf8","bcaf96e7b4f8944b8f826ca4","d1f13a20942ea690d17de4ee","faad83253bf0cd493810cf1d","b0ebad2ad0641863d37bfcff","2374008346c3d2efbeb3f76f","1233431063bef28b3ad6dc05","5c128f4b8dc13d7ead176f73","43a90832eac7075dfca9818a","f0f6d0339835938666f2df01"]},{"q":"What is the lowest voltage you can accept at the last light of a circuit? (volts)","type":"num","red":false,"unit":"V","ref":"Field Standard p.4, What this means on the job (Under 22.8 V at the last light? Move the injection.)","s":"e223642f3dfbe29a","h":["b261d2d77d86d5e53bc31bfb"]},{"q":"The lights at the far end of a run look dim and a bit yellow. What is going on, and what is the fix?","type":"mc","options":["Bad lights - replace them","Voltage drop - the fix is a closer injection, never a bigger supply","The breaker is too small - fit a bigger one","The app needs an update"],"red":false,"ref":"Field Standard p.4, What this means on the job","s":"22cbf1ce64260f3f","h":["95d9d260bb5d5da3701a3efe"]},{"q":"What next? Your partner wants to join two wires up on the roofline with lever nuts (inside-only connectors). What do you tell him?","type":"mc","options":["Fine, just add grease","Fine if it is under the eave","Fine, but tighten them hard","No - lever nuts are not waterproof. They go inside the box only, never outside in the weather"],"red":true,"ref":"Field Standard p.4, Keeping water out (not waterproof. Inside the box only. Never outside in the weather.)","s":"e41682381cc8c861","h":["4921cf73effa91ddbe86cb63"]}]},{"id":"P5","part":4,"title":"How to wire it","pages":"Field Standard 01 v1.1, page 5 (How to wire it)","questions":[{"q":"How is each group of lights wired?","type":"mc","options":["All groups share one thick feeder","Each group is wired straight to the supply","Each group gets its own wire from its own 4 A breaker","Two groups share each breaker"],"red":false,"ref":"Field Standard p.5, One circuit. One breaker. Kept apart.","s":"eea7db41cc01eecc","h":["0a80286fae57cc453ac2185b"]},{"q":"At every injection point, which wire do you cut?","type":"mc","options":["The positive","The data wire","Both wires","Neither - leave everything joined"],"red":true,"ref":"Field Standard p.5, One circuit. One breaker. Kept apart. + step 4 (Cut the positive at every injection point. Leave the data wire alone.)","s":"960cec715673e9c7","h":["4141a23e3c7408bcc35bf25c"]},{"q":"Which of these are NEVER OK? (select all that apply)","type":"multi","options":["Putting the controller on its own 4 A breaker","Wiring a run straight to the power supply with no breaker","Cutting the positive at every injection point","Running more than one injection point off a single feeder"],"red":false,"ref":"Field Standard p.5, Two things that are never OK","s":"161e339f70a3a85a","h":["e99caa264774d77a27298783"]},{"q":"Why do we cut the positive at each injection?","type":"mc","options":["So the pattern stays smooth","To save wire","So the lights get brighter","If it stays joined, power flows into the next group and one breaker ends up carrying two or three groups"],"red":false,"ref":"Field Standard p.5, Why we cut the positive","s":"4c0bbf04e6a95dec","h":["334bb065ad16425a45aa765c"]},{"q":"Your partner wants to feed two injection points off one feeder to finish faster. What do you do?","type":"mc","options":["Do it if both groups are under 60 lights","Do not do it - one feeder per injection. If a job seems to need it, stop and call Ben","Do it with 14/2 wire","Do it and fit a bigger breaker"],"red":true,"ref":"Field Standard p.5, step 2 + Two things that are never OK (If a job seems to need either one, stop and call Ben.)","s":"55ccf292751506be","h":["dccf0c40752dd508b26a69cc"]},{"q":"While cutting at an injection point, your partner also cuts the data wire. What is the problem?","type":"mc","options":["The data wire must run all the way through, so the pattern stays smooth - leave it alone","No problem","The breaker will be too small","It makes the run pull more amps"],"red":false,"ref":"Field Standard p.5 diagram (DATA WIRE - runs all the way through. Never cut this.) + step 4","s":"d03c769363b0ffe8","h":["56c9394a57bbfefbb53ec8bb"]},{"q":"A job has three light groups plus the controller. How many 4 A breakers does it use? (breakers)","type":"num","red":true,"unit":"breakers","ref":"Field Standard p.5, step 3 (Put each feeder on its own 4 amp breaker. The controller gets its own too.)","s":"441f34b001bebc70","h":["77e7886bb3a11f625492b0a9"]},{"q":"Which is step 1 of \"Do it in this order\"?","type":"mc","options":["Pull the feeders","Cut the positive","Plan it first - photo every roofline, measure the run, mark each injection on the photo","Grease the connectors"],"red":false,"ref":"Field Standard p.5, Do it in this order (step 1)","s":"3dc1bb20ce7f2f6e","h":["5267ef216ad330f78fa9a884"]},{"q":"On the marked-up job photo, what is the most lights allowed between two injection dots? (lights)","type":"num","red":false,"unit":"lights","ref":"Field Standard p.5, What goes on the photo (The light count between each dot. Never over 70.)","s":"27f6d7849f75fbc4","h":["0cd6a7642fb420ce778741be"]},{"q":"What next? The feeders are pulled, every feeder has its own breaker, the positives are cut and the connectors are greased. What is the last step before you pack up?","type":"mc","options":["Pack up - it is done","Turn it on and test it on PW (the tests in Part 6)","Test it on BW","Add a few more lights to the last group"],"red":false,"ref":"Field Standard p.5, step 6 (Turn it on and test it on PW before you pack up. See page 7.)","s":"c029114ef7a4abce","h":["bbb75f580e8ebc2a1097c02b"]}]},{"id":"P6","part":5,"title":"Right way, wrong way","pages":"Field Standard 01 v1.1, page 6 (Right way, wrong way)","questions":[{"q":"In the wrong-way box (one wire feeding all three injections, no breakers), what happens if one group shorts?","type":"mc","options":["One breaker trips","The controller turns the lights off","The supply turns itself down to 4 A","Nothing shuts off - the wire just keeps getting hotter"],"red":false,"ref":"Field Standard p.6, WRONG - this is what we are fixing (If one shorts, nothing shuts off.)","s":"2aa80e629  AD.admins.forEach(function(a,i){h+='<div class="row" style="padding:8px 0;border-top:1px solid #eee"><span>'+esc(a.email)+(a.email===AD.me?' <span class="muted">(you)</span>':'')+'<br><span class="muted">'+(!a.onList?'Not on the people list, so no login':a.login?'Has a login':'No login yet')+'</span></span>'+(a.email===AD.me?'':'<button type="button" class="tag bad" data-rm="'+i+'" data-l="Remove" style="padding:6px 12px">Remove</button>')+'</div>';});
 h+='<form id="admf" style="margin-top:10px"><label class="fl">Add an admin (email)<input type="email" id="ad" required autocomplete="off"></label><button type="submit" id="adb" data-l="Add admin">Add admin</button></form></div>';

 function match(p){var q=AF.q.trim().toLowerCase();if(q&&(p.name+" "+p.email).toLowerCase().indexOf(q)<0)return false;
  switch(AF.f){case"overdue":return !!p.overdue;case"nolink":return !p.linkSent;case"nologin":return !p.login;case"inprog":return p.passed>0&&!done(p);case"new":return p.type==="New hire";case"existing":return p.type==="Existing";case"test":return p.test;}return true;}
 function card(p){var i=all.indexOf(p),c='<div class="card"'+(p.active?'':' style="opacity:.75"')+'><div class="row"><b>'+esc(p.name)+'</b><span>'+(p.test?'<span class="tag wait">Test</span> ':'')+(done(p)?'<span class="tag ok">Passed all '+T+'</span>':'')+'</span></div><div class="muted">'+esc(p.email||"(no email)")+' · '+esc(p.type)+'</div>'+
   '<p style="margin:8px 0">'+(p.linkSent?'<span class="tag ok">Link sent'+(typeof p.invited==="number"?' '+esc(fmtD(p.invited)):'')+'</span>':'<span class="tag wait">Link not sent</span>')+' '+(p.login?'<span class="tag ok">Has a login</span>':'<span class="tag wait">No login yet</span>')+' <span class="tag open">Passed '+Math.min(p.passed,T)+'/'+T+'</span> '+(p.overdue?'<span class="tag bad">⚠️ Overdue · deadline '+esc(fmtD(p.deadline))+' · Part'+(p.overdueParts.length>1?'s ':' ')+esc(p.overdueParts.join(", "))+' left</span>':p.deadline?'<span class="tag wait">Deadline '+esc(fmtD(p.deadline))+'</span>':'<span class="tag open">No deadline</span>')+'<br><span class="muted" style="font-size:12px">'+signTxt(p)+'</span></p><div style="display:flex;flex-wrap:wrap;gap:6px">';

  return c+'</div>';}
 function list(){var o="";[["people","People in training"],["passed","Passed"],["archived","Archived"]].forEach(function(x){var ps=sec[x[0]].filter(match);if(x[0]==="archived"&&!ps.length)return;

 function wire(){

  Array.prototype.forEach.call(document.querySelectorAll("[data-dle]"),function(b){var i=+b.getAttribute("data-dle"),p=all[i];b.onclick=function(){var e=$("dle"+i);e.style.display=e.style.display==="none"?"":"none";};dlWire("dl"+i);if(p.deadline){$("dl"+i).value="custom";$("dl"+i+"d").value=p.deadlineYmd||"";$("dl"+i).onchange();}});
  Array.prototype.forEach.call(document.querySelectorAll("[data-dls]"),function(b){b.onclick=function(){var i=+b.getAttribute("data-dls"),p=all[i],dv=dlVal("dl"+i);if(!dv)return;adminDo({api:"adminDeadline",name:p.name,deadline:dv.deadline,deadlineDate:dv.deadlineDate},b,p.name+": "+(dv.deadline==="none"?"no deadline.":"deadline saved."));};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-res]"),function(b){b.onclick=function(){var p=all[+b.getAttribute("data-res")];adminDo({api:"adminActive",name:p.name,on:true},b,p.name+" restored.");};});
  Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(b){b.onclick=function(){var p=all[+b.getAttribute("data-del")];if(!confirm("Delete "+p.name+" from training? This removes them from the list for good. Their old quiz results stay in the log. To keep them, use Archive instead."))return;adminDo({api:"adminDelete",name:p.name},b,p.name+" deleted.");};});}

 Array.prototype.forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.onclick=function(){var a=AD.admins[+b.getAttribute("data-rm")];if(!confirm("Remove "+a.email+" as an admin?"))return;adminDo({api:"adminRemoveAdmin",email:a.email},b,a.email+" is no longer an admin.");};});
